name: paylio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.3
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  provider: ^6.1.2
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  csv: ^6.0.0
  share_plus: ^11.0.0
  fl_chart: ^0.69.0
  http: ^1.2.1
  local_auth: ^2.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/paylio_logo.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/logo/paylio_logo.png"

flutter_native_splash:
  color: "#F9FAFB"
  image: assets/logo/paylio_logo.png
  android: true
  ios: false
